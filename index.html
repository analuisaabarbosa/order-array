<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="assets/arrayIcon.svg" type="image.svg" />
    <title>Order Array</title>
  </head>
  <body>
    <div class="container">
      <div class="array-section">
        <h2>Números:</h2>
        <ul id="numbers-array"></ul>
        <div id="numbers-buttons">
          <button class="asc" onclick="sortArray(window.arrayNumbers, false)">Crescente</button>
          <button class="desc" onclick="sortArray(window.arrayNumbers, true)">Decrescente</button>
          <input
            type="text"
            id="search-numbers"
            placeholder="Pesquisar letras"
            oninput="search()"
          />
          <p id="message-numbers" class="message"></p>
        </div>
      </div>
      <div class="array-section">
        <h2>Letras:</h2>
        <ul id="letters-array"></ul>
        <div id="letters-buttons">
          <button class="asc" onclick="sortArray(window.arrayLetters, false)">Crescente</button>
          <button class="desc" onclick="sortArray(window.arrayLetters, true)">Decrescente</button>
          <input
            type="text"
            id="search-letters"
            placeholder="Pesquisar números"
            oninput="search()"
          />
          <p id="message-letters" class="message"></p>
        </div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
